name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the one Python version this project actually declares
        # and tests against (see .python-version and pyproject.toml's own
        # requires-python) - no matrix of Python minors until a real need
        # to support more than one is confirmed. ubuntu-latest is the
        # canonical, fully-verified target; macos-latest is included
        # because this project is developed and its full suite already
        # passes on macOS - windows-latest is deliberately left out until
        # someone actually verifies it (see the release notes).
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (and Python 3.12)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build
